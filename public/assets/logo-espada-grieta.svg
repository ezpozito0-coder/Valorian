<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" shape-rendering="crispEdges">
  <!-- Fondo escudo rúnico sutil -->
  <rect x="4" y="21" width="24" height="7" fill="#181D2A"/>
  <rect x="6" y="20" width="20" height="9" fill="#2A3142"/>
  <!-- Piedra izquierda (Alba) y derecha (Hierro) -->
  <rect x="5" y="22" width="9" height="5" fill="#3B4254"/>
  <rect x="18" y="22" width="9" height="5" fill="#3B4254"/>
  <rect x="6" y="22" width="7" height="1" fill="#6E737B"/>
  <rect x="19" y="22" width="7" height="1" fill="#6E737B"/>
  <!-- Grieta del Vacío brillante -->
  <rect x="13" y="20" width="6" height="9" fill="#0D0A14"/>
  <rect x="14" y="19" width="4" height="10" fill="#4C1D95"/>
  <rect x="15" y="20" width="2" height="8" fill="#9333EA"/>
  <rect x="12" y="24" width="2" height="2" fill="#9333EA"/>
  <rect x="18" y="23" width="2" height="2" fill="#9333EA"/>
  <rect x="10" y="26" width="2" height="1" fill="#4C1D95"/>
  <rect x="20" y="26" width="2" height="1" fill="#4C1D95"/>
  <!-- Destellos del Vacío -->
  <rect x="11" y="17" width="1" height="1" fill="#9333EA"/>
  <rect x="20" y="16" width="1" height="1" fill="#9333EA"/>
  <rect x="9" y="20" width="1" height="1" fill="#D9A441"/>
  <rect x="22" y="20" width="1" height="1" fill="#D9A441"/>
  <!-- Contorno oscuro de la espada -->
  <rect x="14" y="2" width="4" height="2" fill="#0D0A14"/>
  <rect x="14" y="4" width="4" height="5" fill="#0D0A14"/>
  <rect x="9" y="8" width="14" height="3" fill="#0D0A14"/>
  <rect x="13" y="11" width="6" height="13" fill="#0D0A14"/>
  <!-- Pomo y empuñadura dorada -->
  <rect x="15" y="3" width="2" height="1" fill="#D9A441"/>
  <rect x="15" y="4" width="2" height="4" fill="#9E2A2B"/>
  <rect x="15" y="5" width="1" height="2" fill="#C97A32"/>
  <!-- Guarda dorada -->
  <rect x="10" y="9" width="12" height="1" fill="#D9A441"/>
  <rect x="11" y="10" width="10" height="1" fill="#C97A32"/>
  <rect x="15" y="9" width="2" height="1" fill="#F4F6FA"/>
  <!-- Hoja de acero 16-bit -->
  <rect x="14" y="11" width="4" height="12" fill="#CBD5E1"/>
  <rect x="14" y="11" width="2" height="12" fill="#F4F6FA"/>
  <rect x="16" y="11" width="2" height="12" fill="#94A3B8"/>
  <rect x="15" y="12" width="1" height="10" fill="#1E4E8C"/>
  <!-- Punta clavada en la grieta -->
  <rect x="15" y="23" width="2" height="2" fill="#E2E8F0"/>
  <rect x="15" y="25" width="2" height="1" fill="#9333EA"/>
</svg>
